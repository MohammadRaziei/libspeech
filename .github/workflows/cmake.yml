name: cmake stuff

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    # speech::models (BUILD_MODELS=ON, the default) needs httpp on the
    # CMAKE_PREFIX_PATH via find_package(httpp) -- see the "Model
    # downloading" comment block in the top-level CMakeLists.txt. This has
    # to happen before the configure step below, since CMake shells out to
    # `python -c "import httpp; ..."` at configure time to locate it.
    - name: Install httpp
      run: pip install httpp

    - name: Build Project
      uses: threeal/cmake-action@v2.1.0
      with:
        build-dir: build
        options: |
          CMAKE_BUILD_TYPE=Release
          BUILD_MODELS=ON
          BUILD_TESTS=ON
          BUILD_PYTHON=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --build-config Release

  build-docs:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Doxygen + graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Configure CMake
      run: |
        cmake -B build \
          -DBUILD_MODELS=OFF \
          -DBUILD_TESTS=OFF \
          -DBUILD_DOCS=ON

    - name: Build documentation
      run: cmake --build build --target speech_docs

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      with:
        name: cmake-documentation
        path: build/docs/out/html
        retention-days: 5

  build-coverage:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    # httpp: needed at CMake-configure time (see build-and-test above).
    # coverage: drives speech_coverage_python. The rest of the Python side
    # (nanobind, pytest, ...) is installed by CMakeLists.txt itself when
    # BUILD_PYTHON=ON.
    - name: Install python dependencies
      run: pip install httpp coverage

    - name: Install lcov
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    # Same shape as ctoon's coverage job: every component (speech::dsp,
    # speech::models C++ tests + the Python package's tests) is covered
    # individually, then merged into coverage/total/ + a dashboard at
    # coverage/index.html. BUILD_COVERAGE is an explicit opt-in (see the
    # comment in tests/CMakeLists.txt for why it isn't implied by lcov
    # merely being installed).
    - name: Configure CMake with coverage
      run: |
        cmake -B build \
          -DBUILD_MODELS=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_PYTHON=ON \
          -DBUILD_COVERAGE=ON

    - name: Generate coverage report
      run: cmake --build build --target speech_coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: build/coverage/total/coverage.lcov
        flags: unittests
        name: codecov-libspeech
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: cmake-coverage-report
        path: build/coverage/
        retention-days: 5
