[build-system]
# httpp is needed at CMake-configure time (find_package(httpp) in
# CMakeLists.txt uses `python -c "import httpp; httpp.get_cmake_dir()"`),
# not just at runtime -- without it here, scikit-build-core's isolated
# build venv (used by `python -m build`/cibuildwheel) doesn't have it
# installed and configure fails with "ModuleNotFoundError: No module named
# 'httpp'", even though a normal `pip install .` / local dev environment
# has it (declared under a normal dependency elsewhere) and never hits this.
requires = ["scikit-build-core>=0.8.0", "nanobind>=2.0.0", "httpp"]
build-backend = "scikit_build_core.build"


[project]
name = "libspeech"
dynamic = ["version"]
description = "Best library for speech"
readme = "README.md"
authors = [
  { name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # "filelock"
  # A genuine runtime dependency, not just a build-time one (see
  # [build-system] requires above for why it's listed there too):
  # __init__.py loads libhttpp_core.so straight from this package via
  # httpp.get_lib_dir() rather than bundling a copy, so libspeech won't
  # import at all without it actually installed. >=0.6.0 because that's
  # the first version confirmed to ship get_lib_dir().
  "httpp>=0.6.0",
]

[project.optional-dependencies]
# Test dependencies. numpy and pytest-xdist are required (no markers) and run every Python test module; the rest only feed
# tests/python/test_librosa_compat.py, which cross-checks load/save/resample/STFT/MFCC/windows
# against librosa and skips itself (instead of failing) if any of them cannot be imported.
#
# Why the markers: librosa pulls in numba -> llvmlite, which publish wheels only for a window
# of platforms and Python versions. When no wheel exists pip does NOT fall back to an older
# release -- it picks the newest one, finds only an sdist and tries to compile LLVM, which
# is exactly how the macOS x86_64 wheel-test job failed (numba 0.68 / llvmlite 0.50 sdists).
#   * Intel macOS (x86_64, also what the Rosetta test of a universal2 wheel reports): numba
#     0.63 dropped x86_64 macOS binaries, 0.62.x is the last release that has them, so cap it
#     there and llvmlite follows numba's own pin to a release that still ships wheels.
#   * Python 3.15 and newer: numba/llvmlite lag new interpreters by months (3.14 support
#     arrived in numba 0.63), so leave the cross-check dependencies out until they catch up.
test = [
  "numpy",  # unconditional: the NumPy fast-path, SIMD and librosa tests all need it
  "pytest-xdist",
  "librosa; python_version < '3.15'",
  "soundfile; python_version < '3.15'",
  "scipy; python_version < '3.15'",
  "numba<0.63; python_version < '3.15' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
]


[project.urls]
"Homepage" = "https://github.com/mohammadraziei/libspeech"
"Bug Tracker" = "https://github.com/mohammadraziei/libspeech/issues"
"Document" = "https://mohammadraziei.github.io/libspeech/latest"


[tool.cibuildwheel]
# musllinux and 32-bit Windows (win32) skips, and MACOSX_DEPLOYMENT_TARGET,
# live in .github/workflows/wheels.yml's cibuildwheel step (as CIBW_SKIP /
# MACOSX_DEPLOYMENT_TARGET env vars) instead of here: cibuildwheel env
# vars set directly in a workflow always take precedence over the
# equivalent pyproject.toml setting -- they don't merge -- so setting
# them here too was dead configuration that the workflow silently
# overrode anyway.
test-command = "pytest {project}/tests"
test-extras = ["test"]
# No test-skip: on the arm64 macOS runner cibuildwheel tests BOTH slices of a universal2 wheel
# (arm64 natively, x86_64 under Rosetta 2; see "Platforms" in the cibuildwheel docs). The old
# `*universal2:arm64` skip is for Intel runners, where the arm64 slice cannot execute, and here
# it silently dropped the only job that runs the arm64 (NEON) code.
#build-verbosity = 1

[[tool.cibuildwheel.overrides]]
# Only the cp312 build's nanobind extensions are actually compiled
# against the Limited API (STABLE_ABI in CMakeLists.txt's
# nanobind_add_module(... STABLE_ABI ...) calls resolves to
# Py_LIMITED_API=0x030C0000, i.e. Python 3.12+, confirmed by inspecting
# an actual local build's compile flags -- nanobind's own STABLE_ABI
# option is a Python-3.12-floor feature, it silently does nothing on
# older interpreters per nanobind's own docs, so the cp39/cp310/cp311
# builds really are ordinary version-locked extensions and must keep
# their default per-version wheel.py-api, or their wheel's tag would be
# lying about what's actually inside).
#
# So only for cp312 do we want scikit-build-core to tag the wheel
# cp312-abi3 (forward-compatible with 3.12, 3.13, 3.14, 3.15, ...)
# instead of the default cp312-cp312 (that one Python version only) --
# set via SKBUILD_WHEEL_PY_API, which is scikit-build-core's env-var
# spelling of its `wheel.py-api` config option.
#
# This has to be an [[overrides]] table with its own `select`, not a
# top-level `CIBW_ENVIRONMENT_CP312` env var in wheels.yml: cibuildwheel
# only recognizes CIBW_ENVIRONMENT_{LINUX,MACOS,WINDOWS} as valid
# per-selector *environment-variable name* suffixes (i.e. by platform),
# not arbitrary identifiers like "CP312" -- an env var spelled that way
# is silently ignored rather than erroring, which is exactly how this
# was never actually applied to the wheels published for 0.1.0 (all
# four came out version-locked, cp312 included -- confirmed by
# inspecting the actual .dist-info/WHEEL of the published wheel).
# `select` here is cibuildwheel's own, real mechanism for the same
# per-build-identifier scoping that env var name was trying (and
# failing) to achieve.
select = "cp312-*"
environment = { SKBUILD_WHEEL_PY_API = "cp312" }


#[tool.scikit-build.cmake.define]
#SOME_DEFINE = "ON"
#
#[tool.scikit-build]
#cmake.args = ["-DSOME_DEFINE=ON", "-DOTHER=OFF"]



[tool.scikit-build]
#wheel.expand-macos-universal-tags = true
build.verbose = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/libspeech/version.h"
regex = '''(?sx)
\#define \s+ LIBSPEECH_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ LIBSPEECH_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ LIBSPEECH_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",  # Python 3.12
]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py38"
src = ["src", "src/bindings/python"]


[tool.ruff.lint]
select = [
   "E", "F", "W", # flake8
   "B",           # flake8-bugbear
   "I",           # isort
   "ARG",         # flake8-unused-arguments
   "C4",          # flake8-comprehensions
   "EM",          # flake8-errmsg
   "ICN",         # flake8-import-conventions
   "ISC",         # flake8-implicit-str-concat
   "G",           # flake8-logging-format
   "PGH",         # pygrep-hooks
   "PIE",         # flake8-pie
   "PL",          # pylint
   "PT",          # flake8-pytest-style
   "PTH",         # flake8-use-pathlib
   "RET",         # flake8-return
   "RUF",         # Ruff-specific
   "SIM",         # flake8-simplify
   "T20",         # flake8-print
   "UP",          # pyupgrade
   "YTT",         # flake8-2020
   "NPY",         # NumPy specific rules
   "PD",          # pandas-vet
]
extend-ignore = [
   "PLR",    # Design related pylint codes
   "E501",   # Line too long
]
unfixable = [
   "T20",  # Removes print statements
   "F841", # Removes unused variables
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]
exclude = ["third_party"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "ARG001", "PT004", "RUF059", "PT011"]
# Stand-alone benchmark scripts: printing progress is their output, they import competitor
# libraries lazily (a missing one must only skip its own cells), and plain os.path is fine.
"benchmarks/**" = ["T20", "PLC0415", "PTH"]
"src/**/__main__.py" = ["T20"]
"src/**/core.py" = ["ARG001", "F401"]
"version.py" = ["T20"]  # CLI script -- printing is the point
"src/bindings/python/libspeech/__init__.py" = ["F403", "F405", "E402"]  # `from ctypes import *`, and shared libs must load before the compiled extensions are imported below them



