[build-system]
# httpp is needed at CMake-configure time (find_package(httpp) in
# CMakeLists.txt uses `python -c "import httpp; httpp.get_cmake_dir()"`),
# not just at runtime -- without it here, scikit-build-core's isolated
# build venv (used by `python -m build`/cibuildwheel) doesn't have it
# installed and configure fails with "ModuleNotFoundError: No module named
# 'httpp'", even though a normal `pip install .` / local dev environment
# has it (declared under a normal dependency elsewhere) and never hits this.
requires = ["scikit-build-core>=0.8.0", "nanobind>=1.4.0", "httpp"]
build-backend = "scikit_build_core.build"


[project]
name = "libspeech"
dynamic = ["version"]
description = "Best library for speech"
readme = "README.md"
authors = [
  { name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # "filelock"
]

[project.optional-dependencies]
test = ["pytest-xdist", "requests"]
online = ["requests"]


[project.urls]
"Homepage" = "https://github.com/mohammadraziei/libspeech"
"Bug Tracker" = "https://github.com/mohammadraziei/libspeech/issues"
"Document" = "https://mohammadraziei.github.io/libspeech/latest"


[tool.cibuildwheel]
# ONNX Runtime's official releases (what cmake/ONNXRuntime.cmake downloads)
# are only ever built against glibc -- there's no Microsoft-published musl/
# Alpine binary at all (see e.g. microsoft/onnxruntime#2909, #6800, #9483).
# Alpine's own package repo does carry an `onnxruntime` package, but only
# because Alpine rebuilds it themselves from source against musl -- that's
# a separate build, not something this project can just download. Linking
# our own code against the glibc build inside a musllinux (Alpine-based)
# cibuildwheel container therefore always fails: musl doesn't even have
# glibc's versioned-symbol scheme (the many
# "undefined reference to ...@GLIBC_x.y"/"@GLIBCXX_x.y" errors), nor
# separate libdl/librt/libpthread .so files (musl folds all three into
# libc itself). Skip musllinux entirely rather than let every build fail
# here the same way.
#
# cp*-win32 (32-bit Windows) is skipped for the same class of reason:
# Microsoft stopped publishing 32-bit Windows (win-x86) ONNX Runtime
# binaries somewhere around v1.17.3 -- the version this project downloads
# (see cmake/ONNXRuntime.cmake's onnx_version) has no win-x86 release
# asset, only win-x64/win-arm64, so cmake always falls back to the x64
# build regardless of the actual 32-bit target, producing an
# x64-vs-x86 machine-type mismatch at link time
# ("_OrtGetApiBase" unresolved, "library machine type 'x64' conflicts
# with target machine type 'x86'"). There's no download to correct this
# to -- skip the target instead.
skip = ["*-musllinux_*", "cp*-win32"]
test-command = "pytest {project}/tests"
test-extras = ["test"]
test-skip = ["*universal2:arm64"]
#build-verbosity = 1

[tool.cibuildwheel.macos]
# ONNX Runtime's own v1.21.0 release notes state outright: "All macOS
# packages now require macOS version >= 13.3." The default compile flags
# here still target 10.15 (see -mmacosx-version-min=10.15 in build logs),
# so without this, delocate-wheel's final compatibility check correctly
# refuses to ship the wheel: it would claim 10.15 compatibility while
# bundling a dylib (libonnxruntime.1.21.0.dylib) whose own embedded
# LC_VERSION_MIN load command says 13.3, i.e. a real, unavoidable
# constraint from upstream, not something buildable around.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }


#[tool.scikit-build.cmake.define]
#SOME_DEFINE = "ON"
#
#[tool.scikit-build]
#cmake.args = ["-DSOME_DEFINE=ON", "-DOTHER=OFF"]



[tool.scikit-build]
#wheel.expand-macos-universal-tags = true
build.verbose = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/libspeech/version.h"
regex = '''(?sx)
\#define \s+ LIBSPEECH_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ LIBSPEECH_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ LIBSPEECH_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",  # Python 3.12
]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py38"
src = ["src"]


[tool.ruff.lint]
select = [
   "E", "F", "W", # flake8
   "B",           # flake8-bugbear
   "I",           # isort
   "ARG",         # flake8-unused-arguments
   "C4",          # flake8-comprehensions
   "EM",          # flake8-errmsg
   "ICN",         # flake8-import-conventions
   "ISC",         # flake8-implicit-str-concat
   "G",           # flake8-logging-format
   "PGH",         # pygrep-hooks
   "PIE",         # flake8-pie
   "PL",          # pylint
   "PT",          # flake8-pytest-style
   "PTH",         # flake8-use-pathlib
   "RET",         # flake8-return
   "RUF",         # Ruff-specific
   "SIM",         # flake8-simplify
   "T20",         # flake8-print
   "UP",          # pyupgrade
   "YTT",         # flake8-2020
   "NPY",         # NumPy specific rules
   "PD",          # pandas-vet
]
extend-ignore = [
   "PLR",    # Design related pylint codes
   "E501",   # Line too long
]
unfixable = [
   "T20",  # Removes print statements
   "F841", # Removes unused variables
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]
exclude = ["third_party"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "ARG001", "PT004", "RUF059", "PT011"]
"src/**/__main__.py" = ["T20"]
"src/**/core.py" = ["ARG001", "F401"]
"version.py" = ["T20"]  # CLI script -- printing is the point
"src/libspeech/__init__.py" = ["F403", "F405", "E402"]  # `from ctypes import *`, and shared libs must load before the compiled extensions are imported below them



